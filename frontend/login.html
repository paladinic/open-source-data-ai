<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BI Studio - Sign in</title>
  <link rel="icon" type="image/svg+xml" href="img/logo_bg.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script>try{var t=localStorage.getItem('bi-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(_){}</script>
  <style>
    .auth-card {
      max-width: 420px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .auth-logo { margin-bottom: 24px; }
    #auth-error { display: none; }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/full_logo.svg" class="mx-auto d-block" alt="BI Studio">
    </div>

    <div id="auth-error" class="alert alert-danger py-2 small mb-3"></div>

    <!-- ── Step: Sign in / Sign up tabs ──────────────────────────── -->
    <div id="step-auth">
      <ul class="nav nav-tabs mb-4" id="auth-tabs">
        <li class="nav-item">
          <button class="nav-link active" id="tab-signin" onclick="showTab('signin')">Sign in</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-signup" onclick="showTab('signup')">Sign up</button>
        </li>
      </ul>

      <!-- Sign in -->
      <form id="form-signin" onsubmit="submitSignIn(event)">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input id="signin-email" type="email" class="form-control" placeholder="you@example.com" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input id="signin-password" type="password" class="form-control" placeholder="Password" required />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="show-pwd-signin"
                 onchange="document.getElementById('signin-password').type=this.checked?'text':'password'" />
          <label class="form-check-label small" for="show-pwd-signin">Show password</label>
        </div>
        <button id="btn-signin" type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>

      <!-- Sign up -->
      <form id="form-signup" class="d-none" onsubmit="submitSignUp(event)">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email</label>
          <input id="signup-email" type="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Password</label>
          <input id="signup-password" type="password" class="form-control" placeholder="At least 8 characters" required />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="show-pwd-signup"
                 onchange="document.getElementById('signup-password').type=this.checked?'text':'password'" />
          <label class="form-check-label small" for="show-pwd-signup">Show password</label>
        </div>
        <button id="btn-signup" type="submit" class="btn btn-primary w-100">Create account</button>
      </form>
    </div>

    <!-- ── Step: Create workspace ─────────────────────────────────── -->
    <div id="step-workspace" class="d-none">
      <h5 class="mb-1">Create your workspace</h5>
      <p class="text-secondary small mb-4">This is your team's shared space. You can invite colleagues later.</p>
      <form onsubmit="submitWorkspace(event)">
        <div class="mb-3">
          <label class="form-label small fw-semibold">Workspace name</label>
          <input id="workspace-name" type="text" class="form-control" placeholder="e.g. Acme Analytics" required autofocus />
        </div>
        <button id="btn-workspace" type="submit" class="btn btn-primary w-100">Get started</button>
      </form>
    </div>

    <!-- ── Step: Invite acceptance ────────────────────────────────── -->
    <div id="step-invite" class="d-none">
      <h5 class="mb-1">You've been invited</h5>
      <p class="text-secondary small mb-4">Joining your team's workspace…</p>
      <div class="d-flex justify-content-center">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    let _sb = null;
    let _session = null;

    // ── Bootstrap ──────────────────────────────────────────────────────────────

    async function init() {
      // Fetch config to get Supabase credentials
      let config = {};
      try {
        config = await fetch('/api/auth/config').then(r => r.json());
      } catch {
        showError('Cannot reach the backend. Make sure it is running.');
        return;
      }

      if (config.lite) {
        // Lite mode: no auth needed
        localStorage.setItem('auth_token', 'lite-mode');
        window.location.replace('/');
        return;
      }

      if (!config.supabase_url) {
        showError('Supabase is not configured. Check your .env file.');
        return;
      }

      _sb = supabase.createClient(config.supabase_url, config.supabase_anon_key);

      // Already logged in?
      try {
        const { data: { session }, error } = await _sb.auth.getSession();
        if (error) {
          // Clear stale token and let user sign in fresh
          localStorage.removeItem('auth_token');
          if (_isServiceError(error)) {
            showError('Authentication service unavailable. Make sure Supabase is running (supabase start).');
            return;
          }
        }
        if (session) {
          _session = session;
          await _afterAuth(session, false);
          return;
        }
      } catch (err) {
        localStorage.removeItem('auth_token');
        showError('Authentication service unavailable. Make sure Supabase is running (supabase start).');
        return;
      }

      // Invite / magic-link callback: token in URL hash
      if (window.location.hash.includes('access_token')) {
        showStep('invite');
        try {
          const { data, error } = await _sb.auth.getSession();
          if (error || !data.session) {
            showError('Could not complete sign-in from link. Please try again.');
            showStep('auth');
            return;
          }
          _session = data.session;
          await _afterAuth(data.session, true);
        } catch {
          showError('Could not complete sign-in from link. Please try again.');
          showStep('auth');
        }
        return;
      }
    }

    function _isServiceError(error) {
      return error.status >= 500 || error.message === '{}' || error.message === '';
    }

    // Called after successful sign-in or sign-up
    async function _afterAuth(session, isNewOrInvited) {
      localStorage.setItem('auth_token', session.access_token);

      // Check if user already has a workspace
      const wsRes = await fetch('/api/workspaces/mine', {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      }).then(r => r.json());

      if (wsRes.workspace) {
        window.location.replace('/');
        return;
      }

      // No workspace — check for a pending invite first
      const acceptRes = await fetch('/api/workspaces/accept_invite', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      }).then(r => r.json()).catch(() => ({}));
      if (acceptRes.workspace) {
        window.location.replace('/');
        return;
      }

      // New user — create workspace
      showStep('workspace');
    }

    // ── Tab switching ──────────────────────────────────────────────────────────

    function showTab(tab) {
      document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-signin').classList.toggle('d-none', tab !== 'signin');
      document.getElementById('form-signup').classList.toggle('d-none', tab !== 'signup');
      clearError();
    }

    function showStep(step) {
      document.getElementById('step-auth').classList.add('d-none');
      document.getElementById('step-workspace').classList.add('d-none');
      document.getElementById('step-invite').classList.add('d-none');
      document.getElementById(`step-${step}`)?.classList.remove('d-none');
      clearError();
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearError() {
      const el = document.getElementById('auth-error');
      el.style.display = 'none';
      el.textContent = '';
    }

    function _disableBtn(id, text) {
      const b = document.getElementById(id);
      b.disabled = true;
      b._orig = b.textContent;
      b.textContent = text;
    }
    function _enableBtn(id) {
      const b = document.getElementById(id);
      b.disabled = false;
      b.textContent = b._orig || b.textContent;
    }

    // ── Sign in ────────────────────────────────────────────────────────────────

    async function submitSignIn(e) {
      e.preventDefault();
      clearError();
      _disableBtn('btn-signin', 'Signing in…');
      try {
        const email = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value;
        const { data, error } = await _sb.auth.signInWithPassword({ email, password });
        if (error) { showError(_isServiceError(error) ? 'Authentication service unavailable. Is Supabase running?' : (error.message || 'Sign in failed.')); return; }
        _session = data.session;
        await _afterAuth(data.session, false);
      } catch (err) {
        showError(err.message || 'Sign in failed.');
      } finally {
        _enableBtn('btn-signin');
      }
    }

    // ── Sign up ────────────────────────────────────────────────────────────────

    async function submitSignUp(e) {
      e.preventDefault();
      clearError();
      _disableBtn('btn-signup', 'Creating account…');
      try {
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const { data, error } = await _sb.auth.signUp({ email, password });
        if (error) { showError(_isServiceError(error) ? 'Authentication service unavailable. Is Supabase running?' : (error.message || 'Sign up failed.')); return; }
        if (!data.session) {
          // Email confirmation required
          showStep('auth');
          showError('Check your email to confirm your account, then sign in.');
          showTab('signin');
          document.getElementById('signin-email').value = email;
          return;
        }
        _session = data.session;
        localStorage.setItem('auth_token', data.session.access_token);
        showStep('workspace');
      } catch (err) {
        showError(err.message || 'Sign up failed.');
      } finally {
        _enableBtn('btn-signup');
      }
    }

    // ── Create workspace ───────────────────────────────────────────────────────

    async function submitWorkspace(e) {
      e.preventDefault();
      clearError();
      _disableBtn('btn-workspace', 'Creating…');
      try {
        const name = document.getElementById('workspace-name').value.trim();
        const token = _session?.access_token || localStorage.getItem('auth_token');
        const res = await fetch('/api/workspaces/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ name }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showError(err.detail || 'Failed to create workspace.');
          return;
        }
        window.location.replace('/');
      } catch (err) {
        showError(err.message || 'Failed to create workspace.');
      } finally {
        _enableBtn('btn-workspace');
      }
    }

    init();
  </script>
</body>

</html>
